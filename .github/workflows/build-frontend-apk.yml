name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # 升级至 v5 (Node 24 运行环境)

      - name: Set up Java 17
        uses: actions/setup-java@v5 # 升级至 v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./frontend
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v5 # 升级至 v5
        with:
          name: nas-reader-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}