name: nas_reader
description: "A lightweight NAS e-book reader with multi-device sync."
publish_to: 'none'
version: 0.0.14+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 网络与存储
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.3
  open_file: ^3.3.2
  shared_preferences: ^2.2.2

  # EPUB 渲染与解包
  webview_flutter: ^4.7.0
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  archive: ^3.6.1
  xml: ^6.5.0

  # 字体导入与文件选择
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true