name: Build Android APK

on:
  push:
    # branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./frontend
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      # 动态计算版本名并重命名 APK 为 NasReader-<Tag号>.apk
      - name: Rename APK with Tag
        id: prepare_apk
        run: |
          # 提取 Tag 名（例如 v1.0.0），若无 Tag 则使用 Short SHA
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${GITHUB_SHA::7}"
          fi
          
          APK_NAME="NasReader-${TAG_NAME}.apk"
          SRC_PATH="frontend/build/app/outputs/flutter-apk/app-release.apk"
          TARGET_PATH="frontend/build/app/outputs/flutter-apk/${APK_NAME}"
          
          echo "Renaming $SRC_PATH to $TARGET_PATH"
          cp "$SRC_PATH" "$TARGET_PATH"
          
          # 输出变量给后续步骤使用
          echo "apk_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 14

      - name: Publish Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}