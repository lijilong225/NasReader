version: '3.8'

services:
  reader-sync:
    image: reader-sync:latest
    container_name: reader_sync_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=your_super_long_random_jwt_secret_key_here_32chars
      - GIN_MODE=release
      - NAS_BOOKS_DIR=/nas/books
    volumes:
      # 挂载 SQLite 数据库持久化目录
      - ./data:/app/data
      # 将 NAS 上的书库只读挂载到容器内
      - /volume1/Books:/nas/books:ro