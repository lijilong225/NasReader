name: Build & Push Backend Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - "backend/**"
      - ".github/workflows/build-backend-docker.yml"
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

env:
  REGISTRY: ghcr.io
  # 镜像名称转为小写：ghcr.io/用户名/仓库名/reader-sync
  IMAGE_NAME: ${{ github.repository }}/reader-sync

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 写入 GitHub Packages 权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend # 如果 Dockerfile 就在根目录，填 . 即可
          file: ./backend/Dockerfile
          push: true
          # 同时编译 x86_64 与 ARM64，适配各类 NAS 设备
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max